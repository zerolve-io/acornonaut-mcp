name: Security

# This repository had no CI at all. GitHub Secret Protection is being switched
# off org-wide (2026-07), which removes GitHub-side secret scanning from every
# private repo — so without this job nothing would be watching for committed
# credentials here.
#
# That is not hypothetical for this organisation. The same sweep that added
# this file found a live MailerLite API token that had been sitting in
# zerolve-home-landing for thirteen months, and a live-format Anthropic key
# still tracked in workout-creator.
#
# The gitleaks BINARY is MIT-licensed and free; only the gitleaks-action
# wrapper requires a paid licence for organisations. Installing the binary
# directly sidesteps that.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still a leak,
          # and a shallow clone silently misses it.
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          OS="linux"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            OS="darwin"
          fi
          ARCH="x64"
          if [ "${RUNNER_ARCH}" = "ARM64" ]; then
            ARCH="arm64"
          fi
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz"
          curl -sSfL "$URL" | tar xz gitleaks
          chmod +x gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gitleaks — secret detection
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner
